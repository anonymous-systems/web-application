name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 22
  # The project the deploy job targets. Named once so pointing CI at another
  # environment is one edit rather than one per target, and so the value is
  # visible at the top of the file instead of buried three steps down.
  #
  # Production is deliberately not wired up: it has no backends, secrets or App
  # Check key yet. See docs/PRODUCTION_ROLLOUT.md.
  DEPLOY_PROJECT: anonymous-systems-dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The rules specs need the Firestore emulator, so they sit outside the nx
  # `test` target and were never reached by CI — a security rule could regress
  # with every other check green.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # Runs against a synthetic project id in the emulator, so no credentials
      # are involved and nothing live is reachable.
      - run: pnpm test:rules

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Build Cloud Functions
        run: pnpm --filter @workspace/functions build

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Write frontend emulator env
        working-directory: apps/frontend
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat <<'EOF' > .env
          FIREBASE_PROJECT_ID=anonymous-systems-dev
          FIREBASE_API_KEY=api-key
          FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199

          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=auth-domain.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL=https://database-url-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=anonymous-systems-dev
          # Must match firebase.json's storage.bucket — that's what the emulator serves.
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=anonymous-systems-dev.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=messaging-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID=app-id
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=measurement-id
          NEXT_PUBLIC_FIREBASE_API_KEY=api-key
          NEXT_PUBLIC_AUTH_EMULATOR_HOST=localhost:9099
          NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST=localhost:8080
          NEXT_PUBLIC_STORAGE_EMULATOR_HOST=localhost:9199
          NEXT_PUBLIC_FUNCTIONS_EMULATOR_HOST=localhost:5001

          USE_SECURE_COOKIES=false
          COOKIE_SECRET_CURRENT=Rb3lajdH1r9xy5nPV8CF3B8OAsXDcAkrgCl/VL7lKA0=
          COOKIE_SECRET_PREVIOUS=21fhP3vxZRt/HFzpP1JIZ6RsXg6wXwoAhRU3lf0/Y3k=
          EOF

          # App Check has no emulator and is intentionally disabled here: with
          # NEXT_PUBLIC_FIREBASE_RECAPTCHA_SITE_KEY unset, the client skips App Check init.

          # next-firebase-auth-edge resolves the project ID from the service account.
          # In emulator mode the private key is never used to sign or verify tokens, but
          # the admin credentials must be present for the project ID to be determined.
          # jq without -r keeps the key JSON-quoted with literal \n escapes, i.e. a
          # single-line value that .env parsers read correctly.
          {
            echo "FIREBASE_ADMIN_CLIENT_EMAIL=$(echo "$GCP_SA_KEY" | jq -r '.client_email')"
            echo "FIREBASE_ADMIN_PRIVATE_KEY=$(echo "$GCP_SA_KEY" | jq '.private_key')"
          } >> .env

      - name: Write admin emulator env
        working-directory: apps/admin
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat <<'EOF' > .env
          FIREBASE_PROJECT_ID=anonymous-systems-dev
          FIREBASE_API_KEY=api-key
          FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          # Also exported by emulators:exec; set here so `next dev` stays correct
          # if the suite is ever run outside that wrapper.
          FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199

          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=auth-domain.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL=https://database-url-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=anonymous-systems-dev
          # Must match firebase.json's storage.bucket — that's what the emulator serves.
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=anonymous-systems-dev.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=messaging-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID=app-id
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=measurement-id
          NEXT_PUBLIC_FIREBASE_API_KEY=api-key
          NEXT_PUBLIC_AUTH_EMULATOR_HOST=localhost:9099
          NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST=localhost:8080
          NEXT_PUBLIC_STORAGE_EMULATOR_HOST=localhost:9199

          USE_SECURE_COOKIES=false
          COOKIE_SECRET_CURRENT=8Qm2rC7wZs1kTt5yXb9eLd3vNf6hJp0aGu4iOc8lRkM=
          COOKIE_SECRET_PREVIOUS=Yx4nB7vQz2mK9wT5rE1cH6sJ3pL8dF0gA5uI7oZ4kNs=
          EOF

          # Distinct cookie secrets from the frontend, mirroring production: each app
          # signs its own session cookie. App Check is disabled here (no reCAPTCHA key).

          # The admin app uses the Admin SDK (listUsers / setCustomUserClaims), which
          # needs the service account to resolve the project ID. In emulator mode the
          # private key is never used to sign or verify tokens.
          {
            echo "FIREBASE_ADMIN_CLIENT_EMAIL=$(echo "$GCP_SA_KEY" | jq -r '.client_email')"
            echo "FIREBASE_ADMIN_PRIVATE_KEY=$(echo "$GCP_SA_KEY" | jq '.private_key')"
          } >> .env

      - name: Write Cypress emulator env
        run: |
          cat <<'EOF' > cypress.env.json
          {
            "firebaseConfig": {
              "apiKey": "api-key",
              "authDomain": "auth-domain.firebaseapp.com",
              "databaseURL": "https://database-url-default-rtdb.firebaseio.com",
              "projectId": "anonymous-systems-dev",
              "storageBucket": "anonymous-systems-dev.appspot.com",
              "messagingSenderId": "messaging-sender-id",
              "appId": "app-id",
              "measurementId": "measurement-id"
            },
            "firebaseAuthEmulatorHost": "localhost:9099",
            "firebaseStorageEmulatorHost": "127.0.0.1:9199"
          }
          EOF

      - run: pnpm test:e2e

  # Everything App Hosting does not ship. Rules, indexes and functions are all
  # outside the backend build, so they reached the project only when someone
  # remembered to run the CLI: three PRs merged depending on rules that were
  # never deployed, and each time the breakage read as an application bug. The
  # comment counters have the same exposure — they are maintained by a trigger,
  # so an undeployed function shows up as a count that silently never moves.
  #
  # Only dev is targeted today. Production has no alias yet — see
  # docs/PRODUCTION_ROLLOUT.md, "Making the environment selectable".
  deploy-firebase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rules-test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Sets GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools authenticates
      # with. Each target below needs different IAM, and none of it is implied
      # by the others — see docs/PRODUCTION_ROLLOUT.md for the grants.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Rules and indexes deploy as separate steps so a failure names which one
      # broke — they need different IAM, and a combined command fails opaquely
      # when only one of the two is unauthorised.
      #
      # `--project` is explicit rather than relying on the .firebaserc default:
      # the active project is invisible state, and these commands write.
      #
      # `--non-interactive` errors out where it would otherwise prompt, and
      # `--force` — which bypasses those prompts — is deliberately absent. A
      # destructive change, such as dropping an index still present remotely,
      # therefore fails the job instead of being applied unattended.
      #
      # Rules go first: undeployed rules are the gap that actually caused
      # incidents here, so they land even if the index step then fails.
      - name: Deploy Firestore and Storage rules
        run: >
          pnpm exec firebase deploy
          --only firestore:rules,storage
          --project ${{ env.DEPLOY_PROJECT }}
          --non-interactive

      # Needs `roles/datastore.indexAdmin`, which the rules permissions above do
      # not imply.
      - name: Deploy Firestore indexes
        run: >
          pnpm exec firebase deploy
          --only firestore:indexes
          --project ${{ env.DEPLOY_PROJECT }}
          --non-interactive

      # Last, and needing the most: functions deploys build and run on Cloud
      # Run, so the account needs cloudfunctions, run, cloudbuild,
      # artifactregistry and eventarc access on top of the above.
      #
      # firebase.json runs lint and build as predeploy hooks, so a function that
      # does not compile fails here rather than half-deploying.
      #
      # Still no `--force`: for functions it also means "delete any function
      # missing from the source tree", which is not something a merge should do
      # unattended. Removing a function stays a deliberate manual step, as does
      # changing one's trigger type — that is rejected outright and needs the
      # old function deleted first.
      - name: Deploy Cloud Functions
        run: >
          pnpm exec firebase deploy
          --only functions
          --project ${{ env.DEPLOY_PROJECT }}
          --non-interactive
